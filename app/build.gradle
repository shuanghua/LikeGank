/**
 *  navigation.safeargs 该插件内部使用了 kotlinpoet 生成代码库，
 *  根项目引入的插件会覆盖子模块的插件，导致冲突。
 *  所以在子模块引入该插件, 避免与我们的 build-logic -> plugins 插件中的 kotlinpoet 产生冲突
 */

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id "org.jetbrains.kotlin.kapt" apply true
    id 'androidx.navigation.safeargs' version '2.7.7' apply true
    id 'nav-plugin'
}


//afterEvaluate {
//    tasks.named("assembleDebug").configure {
//        dependsOn("processNavDataDebug")
//    }
//}

apply plugin: "realm-android"

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
keystoreProperties.load(new FileInputStream(keystorePropertiesFile))


android {

    lint {
        baseline = file("lint-baseline.xml")
    }

    namespace 'com.shua.likegank'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile file(keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
        }
    }

    compileSdk 34

    defaultConfig {
        applicationId "com.shua.likegank"
        minSdk 21
        targetSdk 34

        versionCode 15
        versionName "6.0.0"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
//            signingConfig signingConfigs.release
        }

        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release

            //遍历输出文件
            android.applicationVariants.all { variant ->
                variant.outputs.all { output ->
                    def outputFile = output.outputFile
                    if (outputFile != null && outputFile.name.endsWith('release.apk')) {
                        def fileName =
                                "release_likegank_${defaultConfig.versionName}" +
                                        "_${defaultConfig.versionCode}" +
                                        "_${variant.buildType.name}" + ".apk"
                        outputFileName = fileName
                    }
                }
            }
        }
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    implementation 'com.google.android.material:material:1.12.0'

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    //implementation "androidx.fragment:fragment:1.3.0-alpha08"
    implementation 'androidx.navigation:navigation-fragment:2.7.7'
    implementation 'androidx.navigation:navigation-ui:2.7.7'

    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.retrofit2:adapter-rxjava2:2.4.0'
    debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.14'

    implementation 'io.reactivex.rxjava3:rxandroid:3.0.2'
    implementation "io.reactivex.rxjava3:rxjava:3.1.8"

    implementation 'com.github.tbruyelle:rxpermissions:0.12'
    implementation 'me.drakeet.multitype:multitype:3.5.0'

    implementation 'com.github.bumptech.glide:glide:4.16.0'
//    kapt 'com.github.bumptech.glide:compiler:4.11.0'

    implementation 'com.jakewharton.timber:timber:5.0.1'
    implementation 'com.github.chrisbanes.photoview:library:1.2.4'

    implementation 'dev.shuanghua.library:android-annotation:1.0.0'
}